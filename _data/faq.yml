- question: How much does a website cost?
  answer: >-
    Project costs vary based on complexity, features, and timeline. We offer flexible
    packages from startup-friendly websites to custom enterprise solutions. Reach out
    for a tailored quote based on your scope.

- question: How long does development take?
  answer: >-
    Typical projects take 2–8 weeks depending on scope. Focused marketing sites usually
    take 2–3 weeks, while custom web applications take 6–8 weeks or more. You will
    receive a clear milestone schedule before we start.

- question: Do you work with international clients?
  answer: >-
    Yes. We serve clients across India, Nepal, the USA, and globally. Our team is
    experienced in remote collaboration across time zones with clear async and live
    communication.

- question: What technologies do you use?
  answer: >-
    We use modern, reliable technologies including React, Next.js, Node.js, Jekyll,
    PHP, and WordPress—always choosing the stack that best fits your goals and
    long-term maintainability.

- question: Do you provide ongoing support?
  answer: >-
    Yes. We offer maintenance plans covering security updates, performance tuning,
    content changes, and responsive technical support well beyond launch day.

- question: Will my website be mobile-friendly?
  answer: >-
    Always. Every site we build is responsive by default and tested across screen
    sizes. Mobile-first usability is built into our standard workflow.
