<section class="section" id="contact">
  <div class="container">
    <div class="cta-card">
      <div class="cta-glow" aria-hidden="true"></div>
      <div class="cta-content">
        <span class="section-label">Let's work together</span>
        <h2 class="section-title">Ready to build <em>something great?</em></h2>
        <p>Tell us about your project, timeline, and goals. We'll reply within one business day.</p>
      </div>
      <div class="cta-actions">
        <a href="mailto:{{ site.email }}" class="btn btn-accent btn-lg">
          Get Free Consultation <span class="btn-arrow" aria-hidden="true">→</span>
        </a>
        <div class="cta-meta">
          <span>Or reach us directly:</span>
          <div>
            <a href="tel:{{ site.phone_href }}">{{ site.phone }}</a>
            <span aria-hidden="true">&middot;</span>
            <a href="mailto:{{ site.email }}">{{ site.email }}</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
