---
layout: default
---

<section class="page-hero">
  <div class="container">
    {% if page.eyebrow %}
      <span class="section-label">{{ page.eyebrow }}</span>
    {% endif %}
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="page-subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </div>
</section>

<section class="section">
  <div class="container page-body">
    {{ content }}
  </div>
</section>
